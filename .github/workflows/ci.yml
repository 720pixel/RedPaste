name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      # web/dist must exist for go:embed; a placeholder is committed, but build
      # the real frontend so the embed matches what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix web install
      - run: npm --prefix web run build
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix web install
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  # Smoke test of the documented container paths: the image with a fresh named
  # volume (SQLite), and the compose stack (Postgres).
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke script
        run: |
          cat > /tmp/smoke.sh <<'EOF'
          set -eu
          base=http://localhost:8080
          for i in $(seq 1 60); do curl -fsS "$base/readyz" && break; sleep 2; done
          curl -fsS "$base/" | grep -qi '<!doctype html'
          slug=$(curl -fsS -X POST "$base/api/v1/pastes" -H 'Content-Type: application/json' \
            -d '{"ciphertext":"c21va2U","cryptoMetadata":{"v":1},"policy":{"expiresInSeconds":3600},"ownerToken":"b3duZXI"}' | jq -r .slug)
          test "$(curl -fsS -X POST "$base/api/v1/pastes/$slug/redeem" | jq -r .ciphertext)" = c21va2U
          echo "round trip ok: $slug"
          EOF
      - name: docker run with a named volume
        run: |
          docker build -t redpaste .
          docker run -d --name redpaste -p 8080:8080 -v redpaste:/data redpaste
          sh /tmp/smoke.sh || { docker logs redpaste; exit 1; }
          docker rm -f redpaste
      - name: docker compose stack
        env:
          REDPASTE_DEV_INSECURE: "1"
        run: |
          export REDPASTE_SERVER_PEPPER=$(openssl rand -hex 32)
          docker compose up -d --build
          sh /tmp/smoke.sh || { docker compose logs; exit 1; }
          docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
