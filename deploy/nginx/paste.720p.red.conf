# RedPaste reverse proxy for paste.720p.red
# RedPaste is a single Go binary that serves both the SPA and the API and sets
# its own strict security headers + CSP, so this proxy does not add an
# application security-headers snippet (avoids duplicate/conflicting CSP).

map $http_upgrade $redpaste_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name paste.720p.red;
    return 301 https://paste.720p.red$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paste.720p.red;

    ssl_certificate     /etc/nginx/ssl/cloudflare/720p.red.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/720p.red.key;
    include /etc/nginx/snippets/ssl-params-cloudflare-origin.conf;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # RedPaste owns its security headers; drop any inherited add_header for this
    # vhost so we don't emit duplicates (e.g. a second X-Frame-Options).
    add_header X-RedPaste-Origin "1" always;

    location ~* /(\.env|\.git|\.ssh|\.aws|wp-login\.php|wp-admin|xmlrpc\.php) { return 444; }

    # Only the live signaling endpoint needs a WebSocket upgrade + long timeouts.
    # Everything else (including POST /api/v1/live) goes through the plain proxy.
    location ~ ^/api/v1/live/[^/]+/signal$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $redpaste_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
